<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zhou Site Tools - Useful interactive web tools including a custom Emoji Maker.">
    <meta name="keywords" content="tools, interactive, emoji maker, braille art, Zhou Site">
    <title>Tools - Zhou Site</title>
    <link rel="stylesheet" href="../index_styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: #fff;
            border: 2px solid #000;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .lang-btn.active {
            background: #000;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button id="btn-en" class="lang-btn active" onclick="setLang('en')">EN</button>
        <button id="btn-zh" class="lang-btn" onclick="setLang('zh')">ZH</button>
    </div>
    <a href="/" class="home-link">🏠</a>
    <div class="container">
        <header class="site-header">
            <h1 data-en="Tools" data-zh="工具">Tools</h1>
        </header>

        <div class="nav-grid">
            <a href="/tools/emoji-maker.html" class="nav-item">
                <div class="icon">
                    <span style="font-size: 50px;">😊</span>
                </div>
                <div class="label" data-en="Emoji Maker" data-zh="表情制作器">Emoji Maker</div>
            </a>
        </div>

        <a href="/" class="back-link" data-en="Back to Home" data-zh="返回主页" style="margin-top: 40px; display: block; text-decoration: none; border: 2px solid #000; padding: 8px 16px; color: #000;">Back to Home</a>
    </div>
    <script src="/i18n.js"></script>
</body>
</html>
