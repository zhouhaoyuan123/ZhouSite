<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zhou Site Playground - Explore interactive web games and experiments.">
    <meta name="keywords" content="playground, web games, interactive, football game, Zhou Site">
    <title>Zhou Site - Playground</title>
    <link rel="stylesheet" href="../index_styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: #fff;
            border: 2px solid #000;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .lang-btn.active {
            background: #000;
            color: #fff;
        }

        [data-lang="zh"] {
            display: none;
        }
    </style>
</head>

<body>
    <a href="/" class="home-link">🏠</a>
    <div class="lang-switch">
        <a href="/search.html" class="lang-btn" style="text-decoration: none;">🔍</a>
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('zh')">ZH</button>
    </div>

    <div class="container">
        <header class="site-header">
            <h1 data-en="Playground" data-zh="游乐场">Playground</h1>
        </header>

        <main class="nav-grid">
            <a href="/playground/football.html" class="nav-item">
                <div class="icon playground-icon">
                    <div class="playground-frame">
                        <div class="flag"></div>
                        <div class="playground-lines">
                            <div class="line vertical"></div>
                            <div class="line vertical"></div>
                            <div class="line vertical"></div>
                            <div class="line horizontal"></div>
                        </div>
                    </div>
                </div>
                <span class="label" data-en="2-Player Football" data-zh="双人足球">2-Player Football</span>
            </a>
        </main>
    </div>

    <script src="/i18n.js"></script>
</body>

</html>
