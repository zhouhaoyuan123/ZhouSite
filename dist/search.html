<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search Zhou Site - Find games, tools, and content across the site.">
    <meta name="keywords" content="search, find, Zhou Site, games, tools">
    <title data-en="Search - Zhou Site" data-zh="搜索 - 周 站">Search - Zhou Site</title>
    <link rel="stylesheet" href="index_styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .lang-btn {
            background: #fff;
            border: 2px solid #000;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .lang-btn.active {
            background: #000;
            color: #fff;
        }

        .search-wrapper {
            background: #fff;
            border: 2px solid #000;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            width: 95%;
            box-sizing: border-box;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .items-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .items-selector select {
            padding: 5px;
            border: 2px solid #000;
            background: #fff;
            font-weight: bold;
            outline: none;
        }

        #searchInput {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #000;
            outline: none;
        }

        #searchButton {
            padding: 12px 24px;
            background: #fff;
            border: 2px solid #000;
            cursor: pointer;
            font-weight: bold;
        }

        #searchButton:hover:not(:disabled) {
            background: #000;
            color: #fff;
        }

        .results-container {
            margin-top: 20px;
            min-height: 200px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #000;
        }

        .page-btn {
            background: #fff;
            border: 2px solid #000;
            padding: 5px 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .page-btn:hover:not(:disabled) {
            background: #000;
            color: #fff;
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .result-item {
            display: block;
            text-decoration: none;
            color: inherit;
            border: 2px solid #000;
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.1s;
        }

        .result-item:hover {
            transform: translateX(5px);
            background: #f9f9f9;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-description {
            font-size: 0.95rem;
            color: #333;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            border: 2px dashed #000;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button id="btn-en" class="lang-btn active" onclick="setLang('en')">EN</button>
        <button id="btn-zh" class="lang-btn" onclick="setLang('zh')">ZH</button>
    </div>
    <a href="/" class="home-link">🏠</a>
    <div class="container">
        <header class="site-header">
            <h1 data-en="Search" data-zh="搜索">Search</h1>
        </header>

        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" data-en-placeholder="Search site content..." data-zh-placeholder="搜索网站内容..." placeholder="Search site content...">
                <button id="searchButton" data-en="Search" data-zh="搜索">Search</button>
            </div>
            <div class="search-controls">
                <div class="items-selector">
                    <label for="itemsPerPage" data-en="Items per page (0 for all):" data-zh="每页显示 (0为全部):">Items per page (0 for all):</label>
                    <input type="number" id="itemsPerPage" min="0" value="5" style="width: 60px; padding: 5px; border: 2px solid #000; background: #fff; font-weight: bold; outline: none;">
                </div>
            </div>
            <div class="results-container" id="resultsList"></div>
            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevPage" class="page-btn" data-en="Prev" data-zh="上一页">Prev</button>
                <div class="page-info" id="pageInfo"></div>
                <button id="nextPage" class="page-btn" data-en="Next" data-zh="下一页">Next</button>
            </div>
        </div>

        <a href="/" class="back-link" data-en="Back to Home" data-zh="返回首页">Back to Home</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.min.js"></script>
    <script src="/i18n.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const resultsList = document.getElementById('resultsList');
            const pagination = document.getElementById('pagination');
            const prevPage = document.getElementById('prevPage');
            const nextPage = document.getElementById('nextPage');
            const pageInfo = document.getElementById('pageInfo');
            const itemsPerPageSelector = document.getElementById('itemsPerPage');
            
            let searchIndex = [];
            let index = null;
            let currentResults = [];
            let currentPage = 1;
            let resultsPerPage = parseInt(itemsPerPageSelector.value);

            try {
                const response = await fetch('search-index.json');
                searchIndex = await response.json();
                
                // Initialize FlexSearch
                index = new FlexSearch.Index({
                    tokenize: "forward",
                    cache: true
                });

                searchIndex.forEach((page, id) => {
                    const content = `${page.title} ${page.description} ${page.url}`;
                    index.add(id, content);
                });
            } catch (e) {
                console.error('Failed to load search index', e);
            }

            function displayResults() {
                resultsList.innerHTML = '';
                
                let paginatedItems;
                if (resultsPerPage === 0) {
                    paginatedItems = currentResults;
                } else {
                    const start = (currentPage - 1) * resultsPerPage;
                    const end = start + resultsPerPage;
                    paginatedItems = currentResults.slice(start, end);
                }

                if (currentResults.length === 0) {
                    resultsList.innerHTML = `<div class="no-results" data-en="No results found" data-zh="未找到结果">No results found</div>`;
                    pagination.style.display = 'none';
                    return;
                }

                paginatedItems.forEach(id => {
                    const item = searchIndex[id];
                    const div = document.createElement('a');
                    div.href = item.url;
                    div.className = 'result-item';
                    div.innerHTML = `
                        <div class="result-title">${item.title}</div>
                        <div class="result-description">${item.description}</div>
                    `;
                    resultsList.appendChild(div);
                });

                // Update pagination UI
                if (resultsPerPage > 0) {
                    const totalPages = Math.ceil(currentResults.length / resultsPerPage);
                    if (totalPages > 1) {
                        pagination.style.display = 'flex';
                        const lang = document.documentElement.lang || 'en';
                        const pageText = lang === 'zh' ? `第 ${currentPage} / ${totalPages} 页` : `Page ${currentPage} of ${totalPages}`;
                        pageInfo.textContent = pageText;
                        prevPage.disabled = currentPage === 1;
                        nextPage.disabled = currentPage === totalPages;
                    } else {
                        pagination.style.display = 'none';
                    }
                } else {
                    pagination.style.display = 'none';
                }
            }

            function performSearch() {
                const query = searchInput.value.trim();
                if (!query || !index) {
                    resultsList.innerHTML = '';
                    pagination.style.display = 'none';
                    return;
                }

                currentResults = index.search(query);
                currentPage = 1;
                displayResults();
            }

            itemsPerPageSelector.addEventListener('input', () => {
                let val = parseInt(itemsPerPageSelector.value);
                if (isNaN(val) || val < 0) val = 0;
                resultsPerPage = val;
                currentPage = 1;
                displayResults();
            });

            searchButton.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', e => {
                if (e.key === 'Enter') performSearch();
            });

            prevPage.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    displayResults();
                    window.scrollTo(0, 0);
                }
            });

            nextPage.addEventListener('click', () => {
                const totalPages = Math.ceil(currentResults.length / resultsPerPage);
                if (currentPage < totalPages) {
                    currentPage++;
                    displayResults();
                    window.scrollTo(0, 0);
                }
            });

            // Update placeholder on lang change
            const originalSetLang = window.setLang;
            window.setLang = (lang) => {
                originalSetLang(lang);
                document.documentElement.lang = lang;
                if (searchInput) {
                    searchInput.placeholder = searchInput.getAttribute(`data-${lang}-placeholder`);
                }
                // Refresh pagination text if results exist
                if (currentResults.length > 0) {
                    displayResults();
                }
            };
        });
    </script>
</body>
</html>
