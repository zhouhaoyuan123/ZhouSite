<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search Zhou Site - Find games, tools, and content across the site.">
    <meta name="keywords" content="search, find, Zhou Site, games, tools">
    <title data-en="Search - Zhou Site" data-zh="搜索 - 周 站">Search - Zhou Site</title>
    <link rel="stylesheet" href="index_styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .lang-btn {
            background: #fff;
            border: 2px solid #000;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .lang-btn.active {
            background: #000;
            color: #fff;
        }

        .search-wrapper {
            background: #fff;
            border: 2px solid #000;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            width: 95%;
            box-sizing: border-box;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #searchInput {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #000;
            outline: none;
        }

        #searchButton {
            padding: 12px 24px;
            background: #fff;
            border: 2px solid #000;
            cursor: pointer;
            font-weight: bold;
        }

        #searchButton:hover:not(:disabled) {
            background: #000;
            color: #fff;
        }

        .results-container {
            margin-top: 20px;
        }

        .result-item {
            display: block;
            text-decoration: none;
            color: inherit;
            border: 2px solid #000;
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.1s;
        }

        .result-item:hover {
            transform: translateX(5px);
            background: #f9f9f9;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-description {
            font-size: 0.95rem;
            color: #333;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            border: 2px dashed #000;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button id="btn-en" class="lang-btn active" onclick="setLang('en')">EN</button>
        <button id="btn-zh" class="lang-btn" onclick="setLang('zh')">ZH</button>
    </div>
    <a href="/" class="home-link">🏠</a>
    <div class="container">
        <header class="site-header">
            <h1 data-en="Search" data-zh="搜索">Search</h1>
        </header>

        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" data-en-placeholder="Search site content..." data-zh-placeholder="搜索网站内容..." placeholder="Search site content...">
                <button id="searchButton" data-en="Search" data-zh="搜索">Search</button>
            </div>
            <div class="results-container" id="resultsList"></div>
        </div>

        <a href="/" class="back-link" data-en="Back to Home" data-zh="返回首页">Back to Home</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.min.js"></script>
    <script src="/i18n.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const resultsList = document.getElementById('resultsList');
            
            let searchIndex = [];
            let index = null;

            try {
                const response = await fetch('search-index.json');
                searchIndex = await response.json();
                
                // Initialize FlexSearch
                index = new FlexSearch.Index({
                    tokenize: "forward",
                    cache: true
                });

                searchIndex.forEach((page, id) => {
                    const content = `${page.title} ${page.description} ${page.url}`;
                    index.add(id, content);
                });
            } catch (e) {
                console.error('Failed to load search index', e);
            }

            function performSearch() {
                const query = searchInput.value.trim();
                if (!query || !index) {
                    resultsList.innerHTML = '';
                    return;
                }

                const results = index.search(query);
                resultsList.innerHTML = '';

                if (results.length === 0) {
                    resultsList.innerHTML = `<div class="no-results" data-en="No results found" data-zh="未找到结果">No results found</div>`;
                    return;
                }

                results.forEach(id => {
                    const item = searchIndex[id];
                    const div = document.createElement('a');
                    div.href = item.url;
                    div.className = 'result-item';
                    div.innerHTML = `
                        <div class="result-title">${item.title}</div>
                        <div class="result-description">${item.description}</div>
                    `;
                    resultsList.appendChild(div);
                });
            }

            searchButton.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', e => {
                if (e.key === 'Enter') performSearch();
            });

            // Update placeholder on lang change
            const originalSetLang = window.setLang;
            window.setLang = (lang) => {
                originalSetLang(lang);
                if (searchInput) {
                    searchInput.placeholder = searchInput.getAttribute(`data-${lang}-placeholder`);
                }
            };
        });
    </script>
</body>
</html>
