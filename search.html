<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Search Zhou Site - Find games, tools, and content across the site. 在周 站搜索 - 查找全站的游戏、工具和内容。">
    <meta name="keywords" content="search, find, Zhou Site, games, tools">
    <title data-en="Search - Zhou Site" data-zh="搜索 - 周 站">Search - Zhou Site</title>
    <link rel="stylesheet" href="index_styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        .search-wrapper {
            background: #fff;
            border: 2px solid #000;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            width: 95%;
            box-sizing: border-box;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .items-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .items-selector select {
            padding: 5px;
            border: 2px solid #000;
            background: #fff;
            font-weight: bold;
            outline: none;
        }

        #searchInput {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #000;
            outline: none;
        }

        #searchButton {
            padding: 12px 24px;
            background: #fff;
            border: 2px solid #000;
            cursor: pointer;
            font-weight: bold;
        }

        #searchButton:hover:not(:disabled) {
            background: #000;
            color: #fff;
        }

        .results-container {
            margin-top: 20px;
            min-height: 200px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #000;
        }

        .page-btn {
            background: #fff;
            border: 2px solid #000;
            padding: 5px 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .page-btn:hover:not(:disabled) {
            background: #000;
            color: #fff;
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .result-item {
            display: block;
            text-decoration: none;
            color: inherit;
            border: 2px solid #000;
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.1s;
        }

        .result-item:hover {
            transform: translateX(5px);
            background: #f9f9f9;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-description {
            font-size: 0.95rem;
            color: #333;
        }

        .no-results,
        .loading-hint,
        .error-tip {
            text-align: center;
            padding: 40px;
            border: 2px dashed #000;
            color: #666;
            margin-top: 20px;
        }

        .error-tip {
            border-color: #f00;
            color: #f00;
        }
    </style>
</head>

<body>
    <div class="lang-switch">
        <button id="btn-en" class="lang-btn active" onclick="setLang('en')">EN</button>
        <button id="btn-zh" class="lang-btn" onclick="setLang('zh')">ZH</button>
    </div>
    <a href="/" class="home-link">🏠</a>
    <div class="container">
        <header class="site-header">
            <h1 data-en="Search" data-zh="搜索">Search</h1>
        </header>

        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" data-en-placeholder="Search site content..."
                    data-zh-placeholder="搜索网站内容..." placeholder="Search site content...">
                <button id="searchButton" data-en="Search" data-zh="搜索">Search</button>
            </div>
            <div class="search-controls">
                <div class="items-selector">
                    <label for="itemsPerPage" data-en="Items per page (0 for all):" data-zh="每页显示 (0为全部):">Items per
                        page (0 for all):</label>
                    <input type="number" id="itemsPerPage" min="0" value="5"
                        style="width: 60px; padding: 5px; border: 2px solid #000; background: #fff; font-weight: bold; outline: none;">
                </div>
                <button id="blogSearchButton" class="page-btn" data-en="Search in Blog" data-zh="在博客中搜索">Search in
                    Blog</button>
                <button id="randomButton" class="page-btn" data-en="Random" data-zh="随机">Random</button>
            </div>
            <div class="results-container" id="resultsList">
                <div id="loadingIndex" class="loading-hint" data-en="Loading search index..." data-zh="正在加载搜索索引..." style="display: block;">Loading search index...</div>
                <div id="loadingSearch" class="loading-hint" data-en="Searching..." data-zh="搜索中..." style="display: none;">Searching...</div>

                <div id="noResults" class="no-results" data-en="No results found" data-zh="未找到结果" style="display: none;">No results found</div>

                <div id="errorLoadIndex" class="error-tip" data-en="Failed to load search index. Please try again later." data-zh="加载搜索索引失败，请稍后重试。" style="display: none;">Failed to load search index. Please try again later.</div>
                <div id="errorEngineNotReady" class="error-tip" data-en="Search engine is not ready." data-zh="搜索引擎未就绪。" style="display: none;">Search engine is not ready.</div>
                <div id="errorSearchFailed" class="error-tip" data-en="An error occurred while searching." data-zh="搜索过程中出错。" style="display: none;">An error occurred while searching.</div>

                <div id="resultsItems"></div>
            </div>
            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevPage" class="page-btn" data-en="Prev" data-zh="上一页">Prev</button>
                <div class="page-info" id="pageInfo"></div>
                <button id="nextPage" class="page-btn" data-en="Next" data-zh="下一页">Next</button>
            </div>
        </div>

        <a href="/" class="back-link" data-en="Back to Home" data-zh="返回首页">Back to Home</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.min.js"></script>
    <script src="/i18n.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const resultsList = document.getElementById('resultsList');
            const resultsItems = document.getElementById('resultsItems');
            const loadingIndex = document.getElementById('loadingIndex');
            const loadingSearch = document.getElementById('loadingSearch');
            const noResultsHint = document.getElementById('noResults');
            const errorLoadIndex = document.getElementById('errorLoadIndex');
            const errorEngineNotReady = document.getElementById('errorEngineNotReady');
            const errorSearchFailed = document.getElementById('errorSearchFailed');
            const pagination = document.getElementById('pagination');
            const prevPage = document.getElementById('prevPage');
            const nextPage = document.getElementById('nextPage');
            const pageInfo = document.getElementById('pageInfo');
            const itemsPerPageSelector = document.getElementById('itemsPerPage');
            const randomButton = document.getElementById('randomButton');
            const blogSearchButton = document.getElementById('blogSearchButton');

            let searchIndex = [];
            let index = null;
            let currentResults = [];
            let currentPage = 1;
            let resultsPerPage = parseInt(itemsPerPageSelector.value);
            if (randomButton) randomButton.disabled = true;

            function hideAllHints() {
                [loadingIndex, loadingSearch, noResultsHint, errorLoadIndex, errorEngineNotReady, errorSearchFailed].forEach(el => {
                    if (el) el.style.display = 'none';
                });
            }

            function showHint(el) { hideAllHints(); if (el) el.style.display = 'block'; }

            try {
                const response = await fetch('search-index.json');
                if (!response.ok) throw new Error('Failed to fetch search-index.json');
                searchIndex = await response.json();

                // Initialize FlexSearch
                index = new FlexSearch.Index({
                    tokenize: "forward",
                    cache: true
                });

                searchIndex.forEach((page, id) => {
                    const content = `${page.title} ${page.description} ${page.url}`;
                    index.add(id, content);
                });

                // Clear results items and hide hints once ready
                if (resultsItems) resultsItems.innerHTML = '';
                hideAllHints();
                // Set up random button
                if (randomButton) {
                    randomButton.disabled = searchIndex.length === 0;
                    randomButton.addEventListener('click', () => {
                        if (!searchIndex || searchIndex.length === 0) return;
                        const rand = Math.floor(Math.random() * searchIndex.length);
                        window.location.href = searchIndex[rand].url;
                    });
                }

                // Set up blog search button
                if (blogSearchButton) {
                    blogSearchButton.addEventListener('click', () => {
                        const q = (searchInput.value || '').trim();
                        const target = q ? `/blog?s=${encodeURIComponent(q)}` : '/blog';
                        window.location.href = target;
                    });
                }
            } catch (e) {
                console.error('Failed to load search index', e);
                // Show the pre-defined load-index error hint (texts are in data-* attributes)
                showHint(errorLoadIndex);
            }

            function displayResults() {
                if (resultsItems) resultsItems.innerHTML = '';
                // ensure any loading/error hints are hidden when we render results
                hideAllHints();

                let paginatedItems;
                if (resultsPerPage === 0) {
                    paginatedItems = currentResults;
                } else {
                    const start = (currentPage - 1) * resultsPerPage;
                    const end = start + resultsPerPage;
                    paginatedItems = currentResults.slice(start, end);
                }

                if (currentResults.length === 0) {
                    showHint(noResultsHint);
                    pagination.style.display = 'none';
                    return;
                }

                paginatedItems.forEach(id => {
                    const item = searchIndex[id];
                    const div = document.createElement('a');
                    div.href = item.url;
                    div.className = 'result-item';
                    div.innerHTML = `
                        <div class="result-title">${item.title}</div>
                        <div class="result-description">${item.description}</div>
                    `;
                    if (resultsItems) resultsItems.appendChild(div);
                });

                // Update pagination UI
                if (resultsPerPage > 0) {
                    const totalPages = Math.ceil(currentResults.length / resultsPerPage);
                    if (totalPages > 1) {
                        pagination.style.display = 'flex';
                        const lang = document.documentElement.lang || 'en';
                        const pageText = lang === 'zh' ? `第 ${currentPage} / ${totalPages} 页` : `Page ${currentPage} of ${totalPages}`;
                        pageInfo.textContent = pageText;
                        prevPage.disabled = currentPage === 1;
                        nextPage.disabled = currentPage === totalPages;
                    } else {
                        pagination.style.display = 'none';
                    }
                } else {
                    pagination.style.display = 'none';
                }
            }

            async function performSearch() {
                const query = searchInput.value.trim();
                if (!query) {
                    currentResults = [];
                    currentPage = 1;
                    if (resultsItems) resultsItems.innerHTML = '';
                    hideAllHints();
                    pagination.style.display = 'none';
                    return;
                }

                if (!index) {
                    showHint(errorEngineNotReady);
                    return;
                }

                // Show the pre-defined searching loading hint (text comes from data-* attributes)
                showHint(loadingSearch);
                pagination.style.display = 'none';

                // Give UI time to update
                await new Promise(resolve => setTimeout(resolve, 0));

                try {
                    currentResults = index.search(query);
                    currentPage = 1;
                    displayResults();
                } catch (e) {
                    console.error('Search failed', e);
                    // show pre-defined search-failed error hint
                    showHint(errorSearchFailed);
                }
            }

            itemsPerPageSelector.addEventListener('input', () => {
                let val = parseInt(itemsPerPageSelector.value);
                if (isNaN(val) || val < 0) val = 0;
                resultsPerPage = val;
                currentPage = 1;
                displayResults();
            });

            searchButton.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', e => {
                if (e.key === 'Enter') performSearch();
            });

            prevPage.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    displayResults();
                    window.scrollTo(0, 0);
                }
            });

            nextPage.addEventListener('click', () => {
                const totalPages = Math.ceil(currentResults.length / resultsPerPage);
                if (currentPage < totalPages) {
                    currentPage++;
                    displayResults();
                    window.scrollTo(0, 0);
                }
            });

            // Update placeholder and hint texts on lang change
            const originalSetLang = window.setLang;
            function applyI18nText(el, lang) {
                if (!el) return;
                const attr = el.getAttribute(`data-${lang}`);
                if (attr) el.textContent = attr;
            }

            window.setLang = (lang) => {
                originalSetLang(lang);
                document.documentElement.lang = lang;
                if (searchInput) {
                    searchInput.placeholder = searchInput.getAttribute(`data-${lang}-placeholder`);
                }

                // Apply i18n to all known hint elements
                [loadingIndex, loadingSearch, noResultsHint, errorLoadIndex, errorEngineNotReady, errorSearchFailed].forEach(el => applyI18nText(el, lang));

                // Refresh pagination text if results exist
                if (currentResults.length > 0) {
                    displayResults();
                }
            };
        });
    </script>
</body>

</html>
