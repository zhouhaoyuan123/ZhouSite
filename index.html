<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhou Site</title>
    <link rel="stylesheet" href="index_styles.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <h1>Zhou<br>Site</h1>
        </header>
        
        <main class="nav-grid">
            <a href="/playground" class="nav-item">
                <div class="icon playground-icon">
                    <div class="playground-frame">
                        <div class="flag"></div>
                        <div class="playground-lines">
                            <div class="line vertical"></div>
                            <div class="line vertical"></div>
                            <div class="line vertical"></div>
                            <div class="line horizontal"></div>
                        </div>
                    </div>
                </div>
                <span class="label">playground</span>
            </a>

            <a href="/tools" class="nav-item">
                <div class="icon tools-icon">
                    <div class="tool-head"></div>
                    <div class="tool-handle"></div>
                </div>
                <span class="label">tools</span>
            </a>

            <a href="/blog" class="nav-item">
                <div class="icon blog-icon">
                    <div class="blog-lines">
                        <div class="blog-line"></div>
                        <div class="blog-line"></div>
                        <div class="blog-line"></div>
                    </div>
                </div>
                <span class="label">blog</span>
            </a>
        </main>
    </div>
</body>
</html>
